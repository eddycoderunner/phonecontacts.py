{% extends "base.html" %}
{% block title %}Edit Contact · ContactHub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Edit Contact</h2>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>First Name *</label>
                <input type="text" name="first_name" value="{{ contact.first_name }}" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ contact.last_name or '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Phone *</label>
                <input type="tel" name="phone" value="{{ contact.phone }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ contact.email or '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Company</label>
                <input type="text" name="company" value="{{ contact.company or '' }}">
            </div>
            <div class="form-group">
                <label>Group</label>
                <input type="text" name="group_name" value="{{ contact.group_name or '' }}">
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" name="address" value="{{ contact.address or '' }}">
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="3">{{ contact.notes or '' }}</textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
