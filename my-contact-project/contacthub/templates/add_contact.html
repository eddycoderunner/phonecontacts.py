{% extends "base.html" %}
{% block title %}Add Contact . ContactHub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Add New Contact</h2>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone" required placeholder="+254 7xx xxx xxx">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Company</label>
                <input type="text" name="company">
            </div>
            <div class="form-group">
                <label>Group</label>
                <input type="text" name="group_name" placeholder="Friends, Family, Work.." list="group-suggestions">
                <datalist id="group-suggestions">
                    <option value="Friends">
                    <option value="Family">
                    <option value="Work">
                    <option value="University">
                    <option value="Clients">
                </datalist>
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" name="address">
        </div>

        <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="3"></textarea>
        </div>

        <div class="forma" -actions>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Contact</button>
        </div>
    </form>
</div>
{% endblock %}

<!-- launching on browser
1. cd my-contact-project\contacthub
2. venv\Scripts\activate
3. pip install -r requirements.txt
4. python app.py -->
